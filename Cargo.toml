[package]
name = "tui-calculator"
version = "0.1.0"
edition = "2024"
description = "A TUI calculator built with Ratatui"

[dependencies]
# `palette` feature: pulls in (and re-exports) the `palette` crate for
# `Color::from_hsluv`, used to build the rainbow palette in perceptually-uniform
# HSLuv space so the ten digit hues read as evenly bright (see `ui::glyph_color`).
ratatui = { version = "0.30", features = ["palette"] }
crossterm = { version = "0.29", features = ["event-stream"] }
# `wayland-data-control` adds the Wayland clipboard backend; arboard's default
# Linux backend only covers X11/XWayland, so pure-Wayland sessions need it. The
# feature's deps are Linux-gated upstream, so it's a no-op on macOS/Windows.
arboard = { version = "3", features = ["wayland-data-control"] }
