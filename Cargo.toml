[workspace]
# The native binary is the root package (so `cargo run` still launches it);
# `crates/core` is the backend-free calculator library it — and the web build —
# depend on. Deps are per *package*, which is why the split is a workspace
# rather than one target-gated package: the web build must never see crossterm
# or arboard, neither of which compiles for `wasm32-unknown-unknown`.
members = ["crates/core"]

[package]
name = "tui-calculator"
version = "0.1.0"
edition = "2024"
description = "A TUI calculator built with Ratatui"

[dependencies]
calculator-core = { path = "crates/core" }
# Default features on: the native binary needs ratatui's crossterm backend. The
# core declares its own ratatui entry with defaults off (see crates/core).
# `palette` here too so `cargo build -p tui-calculator` alone resolves the same
# feature set the core asks for.
ratatui = { version = "0.30", features = ["palette"] }
crossterm = { version = "0.29", features = ["event-stream"] }
# `wayland-data-control` adds the Wayland clipboard backend; arboard's default
# Linux backend only covers X11/XWayland, so pure-Wayland sessions need it. The
# feature's deps are Linux-gated upstream, so it's a no-op on macOS/Windows.
arboard = { version = "3", features = ["wayland-data-control"] }

[dev-dependencies]
calculator-core = { path = "crates/core", features = ["test-support"] }
