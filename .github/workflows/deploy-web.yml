name: Deploy web

# Builds crates/web with Trunk once and publishes that one dist/ twice: to
# GitHub Pages (https://lix42.github.io/tui-calculator/) and to Cloudflare
# Workers Static Assets (https://calc.xuli.dev and https://calc.lix42.com).
# Pull requests (and manual runs from other branches) run only the build; the
# `pages` and `cloudflare` jobs publish from main alone. So a change that breaks the web build
# fails before merge, and nothing unmerged reaches the live site.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Per ref: one deploy at a time on main, never cancelled mid-flight (a
# half-finished Pages deployment is worse than a short wait); a newer push to a
# PR supersedes its older build.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm target and Trunk
      run: |
        rustup target add wasm32-unknown-unknown
        curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C /usr/local/bin trunk
    # `--public-url ./` makes every asset URL relative, so the same dist/ works
    # under Pages' /tui-calculator/ subpath and at a host's root (Cloudflare).
    - name: Build
      working-directory: crates/web
      run: trunk build --release --cargo-profile wasm-release --public-url ./
    - name: Report size
      working-directory: crates/web/dist
      run: |
        for f in *.wasm *.js; do
          echo "$f: $(stat -c %s "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
        done
    - uses: actions/upload-pages-artifact@v5
      with:
        path: crates/web/dist

  pages:
    needs: build
    # Explicit, not just the `github-pages` environment's main-only branch rule:
    # that rule is a repo setting the workflow can't see. A PR's ref is
    # `refs/pull/…`, so this skips PRs too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5

  cloudflare:
    needs: build
    # Same main-only gate as `pages`; there's no environment rule behind it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Reuse the Pages artifact (a single artifact.tar) instead of uploading
    # dist/ a second time, so both hosts get byte-identical files.
    - uses: actions/download-artifact@v8
      with:
        name: github-pages
        path: ${{ runner.temp }}/pages
    - name: Unpack dist/
      run: |
        mkdir -p crates/web/dist
        tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C crates/web/dist
    - uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: crates/web
        command: deploy
