name: Deploy web

# Builds crates/web with Trunk once and publishes dist/ to GitHub Pages
# (https://lix42.github.io/tui-calculator/). The Cloudflare deploy
# (`web-deploy-cf`) will be a second job publishing the same build.
# Pull requests run only the build (the `pages` job is skipped), so a change
# that breaks the web build fails before merge.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Per ref: one deploy at a time on main, never cancelled mid-flight (a
# half-finished Pages deployment is worse than a short wait); a newer push to a
# PR supersedes its older build.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install wasm target and Trunk
      run: |
        rustup target add wasm32-unknown-unknown
        curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C /usr/local/bin trunk
    # `--public-url ./` makes every asset URL relative, so the same dist/ works
    # under Pages' /tui-calculator/ subpath and at a host's root (Cloudflare).
    - name: Build
      working-directory: crates/web
      run: trunk build --release --cargo-profile wasm-release --public-url ./
    - name: Report size
      working-directory: crates/web/dist
      run: |
        for f in *.wasm *.js; do
          echo "$f: $(stat -c %s "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
        done
    - uses: actions/upload-pages-artifact@v5
      with:
        path: crates/web/dist

  pages:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
