name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --workspace --verbose
    # `--workspace`: at the root, plain `cargo test` runs only the native
    # binary's tests and silently skips calculator-core's.
    - name: Run tests
      run: cargo test --workspace --verbose
    # The web entry (and so the core under it) must stay buildable for wasm: no
    # crossterm/arboard may creep into the core's dependency tree.
    - name: Build web for wasm32
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build -p calculator-web --target wasm32-unknown-unknown --verbose
